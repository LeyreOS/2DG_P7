<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        h1 {
            font-family: "Geo", sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: clamp(100px, 10vw, 180px);
            line-height: 0.9;
            margin-top: 10px;
        }
        :root{
            --lime: #ccff02;
            --dark: #282625;
            --forest: #325444;
            --storm:#8696A8;
            --violet: #E4D2FC;
            --chilli:#EF432B;
            --light:#EFEAE8;

        }
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box;
        }
        .container{
            display:grid;
            height: 100vh;
            width: 100vw;
            grid-template-columns: 1fr 1fr 0.7fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            
        }

        .rectangulo1{
            grid-area: 1/1/2/2;
            background-color:var(--lime);
            padding: 5%;
            
        }
        .rectangulo2{
            grid-area: 2/1/3/2;
            background-color:var(--storm);
            padding: 5%;
        }
        .rectangulo3{
            grid-area: 3/1/4/2;
            background-color:var(--violet);
            padding: 5%;
        }
        .rectangulo4{
            grid-area: 4/1/5/2;
            background-color:var(--chilli);
            padding: 5%;
        }
        .rectangulo5{
            grid-area: 1/2/2/3;
            background-color:var(--dark);
            padding: 5%;
        }
       .rectangulo6{
            grid-area: 2/2/5/3;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

         .negro{
            background-color: var(--dark);
            flex: 2;
        }

        .claro{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--light);
            padding: 5%;
            flex: 8;
        }

        .rectangulo7{
            grid-area: 1/3/5/4;
            background-color:var(--forest);
            padding: 5%;
            position: relative;
        }
         .rectangulo1 h1{
            color:var(--forest);
        }
        .rectangulo2 h1{
            color:var(--light);
        }
        .rectangulo3 h1 {
             color: var(--chilli);
        }
        .rectangulo4 h1{
            color:var(--light)
        }
        .rectangulo5 h1 {
            color: var(--light);
        }
        .rectangulo6 h1{
            color:var(--dark);
        }
        .rectangulo7 h1{
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 170px;
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            color:var(--light);
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="rectangulo1">
            <p>#CCFF02</p>
            <h1>LIME</h1>
        </div>

        <div class="rectangulo2">
            <p>#8696A8</p>
            <h1>STORM</h1>
        </div>

        <div class="rectangulo3">
            <p>#E4D2FC</p>
            <h1>VIOLET</h1>
            </div>

        <div class="rectangulo4">
            <p>#EF432B</p>
            <h1>CHILLY</h1>
        </div>

        <div class="rectangulo5">
            <p>#282625</p>
            <h1>DARK</h1>
        </div>

        <div class="rectangulo6">
            <div class="negro"></div>

            <div class="claro">
                <p>#EFEAE8</p>
            <h1>LIGHT Y BRIGHT</h1>
            </div>

        </div>

        <div class="rectangulo7">
            <p>#325444</p>
            <h1>FOREST</h1>
        </div>
    </div>
</body>
</html>
